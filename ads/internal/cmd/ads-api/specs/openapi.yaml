openapi: "3.0.3"

info:
  title: Ads API
  description: Classified ads — list, read, create, delete and bulk import ads.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [infra]
      responses:
        "200":
          description: Service is up

  /ads:
    get:
      summary: List ads
      operationId: listAds
      tags: [ads]
      parameters:
        - name: title
          in: query
          description: Case-insensitive substring match on the ad title.
          schema:
            type: string
          example: bike
        - name: user_id
          in: query
          description: Filter ads belonging to this owner.
          schema:
            type: string
          example: "00000000-0000-0000-0000-000000000001"
        - name: min_price_cents
          in: query
          description: Inclusive lower bound on the price (in cents). 0 means no lower bound.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 5000
        - name: max_price_cents
          in: query
          description: Inclusive upper bound on the price (in cents). 0 means no upper bound.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 50000
      responses:
        "200":
          description: List of matching ads (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdsResponse"
        "400":
          description: Invalid query parameter (e.g. non-numeric price).

    post:
      summary: Create an ad
      operationId: createAd
      tags: [ads]
      security:
        - userID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdBody"
      responses:
        "201":
          description: Ad created. The body contains the generated identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdResponse"
        "400":
          description: Malformed or unknown request body field.
        "401":
          description: Missing Authorization header.
        "500":
          description: Unexpected server error.

  /ads/import:
    post:
      summary: Bulk ad import
      description: |
        Creates every ad of the request in a single transaction: either all ads are created, or none.
        Send an Idempotency-Key header to retry safely: a retry with the same key and payload returns
        the original result without creating anything.
      operationId: importAds
      tags: [ads]
      security:
        - userID: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique value chosen by the client for this import (a UUID is recommended), reused on retries.
          schema:
            type: string
            maxLength: 255
          example: 6f1d2c9e-7a3b-4e8f-9c1d-2b3a4c5d6e7f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAdsBody"
      responses:
        "201":
          description: Ads created, or replay of a previous import with the same key.
          headers:
            Idempotent-Replayed:
              description: Set to "true" when the response comes from a previous import with the same key.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAdsResponse"
        "400":
          description: Invalid body, invalid price or Idempotency-Key longer than 255 characters. Nothing is created.
        "401":
          description: Missing Authorization header.
        "413":
          description: More than 1000 ads in one import.
        "422":
          description: The Idempotency-Key was already used with a different payload.
        "500":
          description: Unexpected server error. Nothing is created; the import can be retried with the same key.

  /ads/{adID}:
    get:
      summary: Get an ad by ID
      operationId: getAd
      tags: [ads]
      parameters:
        - name: adID
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: The requested ad, with its owner's username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDetails"
        "400":
          description: adID is not a valid integer.
        "404":
          description: No ad exists with this ID.
        "500":
          description: Unexpected server error.

    delete:
      summary: Delete an ad
      description: Only the owner of the ad can delete it.
      operationId: deleteAd
      tags: [ads]
      security:
        - userID: []
      parameters:
        - name: adID
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "204":
          description: Ad deleted.
        "400":
          description: adID is not a valid integer.
        "401":
          description: Missing Authorization header.
        "403":
          description: The ad belongs to another user.
        "404":
          description: No ad exists with this ID.
        "500":
          description: Unexpected server error.

components:
  securitySchemes:
    userID:
      type: apiKey
      in: header
      name: Authorization
      description: The caller's user ID. No token validation is performed — the value is used as-is as the owner identifier.

  schemas:
    Ad:
      type: object
      required: [id, title, price_cents, price, photo_url, user_id, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: mountain bike
        price_cents:
          type: integer
          format: int64
          description: Price in euro cents. Deprecated, use price.
          deprecated: true
          example: 15000
        price:
          type: number
          format: decimal
          description: Price in euros, always with two decimals. Computed from price_cents, never through a float.
          example: 150.00
        photo_url:
          type: string
          example: https://example.com/bike.jpg
        user_id:
          type: string
          example: "00000000-0000-0000-0000-000000000001"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"

    AdDetails:
      allOf:
        - $ref: "#/components/schemas/Ad"
        - type: object
          required: [username]
          properties:
            username:
              type: string
              nullable: true
              description: Nickname of the ad owner. null when the user service cannot provide it.
              example: alice

    ListAdsResponse:
      type: object
      required: [ads]
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/Ad"

    CreateAdBody:
      type: object
      required: [title, photo_url]
      description: Send either price or price_cents, not both (400 otherwise).
      properties:
        title:
          type: string
          example: mountain bike
        price_cents:
          type: integer
          format: int64
          description: Price in euro cents. Deprecated, use price.
          deprecated: true
          example: 15000
        price:
          type: number
          format: decimal
          minimum: 0
          description: Price in euros, at most two decimals. Exponents are rejected.
          example: 150.00
        photo_url:
          type: string
          example: https://example.com/bike.jpg

    ImportAdsBody:
      type: object
      required: [ads]
      properties:
        ads:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CreateAdBody"

    ImportAdsResponse:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: Identifiers of the created ads, in the order of the request.
          items:
            type: integer
            format: int64
          example: [101, 102]

    CreateAdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: Generated identifier of the new ad.
          example: 42